# Mouse support for panes, copy mode, and scrolling.
set -g mouse on
set -g history-limit 100000
set -g focus-events on
set -sg set-clipboard on

# Keep the terminal background instead of tmux's default status color.
set -g status-style "bg=default,fg=white"
set -g message-style "bg=default,fg=white"

# Use a distinct active-pane border without a green accent.
set -g pane-active-border-style "fg=#c6121a"
